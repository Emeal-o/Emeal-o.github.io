<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>F1 2026 — Live Season Hub</title>
  <meta name="description" content="F1 2026 Live Season Hub — Real-time timing, standings, lap analysis">
  <meta name="theme-color" content="#e10600">
  <meta property="og:title" content="F1 2026 Live Season Hub">
  <meta property="og:description" content="Live timing, standings, lap analysis & race results">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #050505;
    }

    #frame {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      /* Extra height to push Streamlit footer off screen */
      height: calc(100% + 80px);
      border: none;
      display: block;
    }

    /* Black bar to cover any Streamlit footer bleeding through */
    #footer-cover {
      position: fixed;
      bottom: 0; left: 0;
      width: 100%;
      height: 60px;
      background: #050505;
      z-index: 999;
      pointer-events: none;
    }

    /* Loading screen */
    #loader {
      position: fixed;
      inset: 0;
      background: #050505;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity .6s ease;
    }
    #loader.hidden { opacity: 0; pointer-events: none; }

    .badge {
      background: #e10600;
      color: #fff;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 4px;
      padding: 3px 10px;
      text-transform: uppercase;
      margin-bottom: 10px;
      font-family: Arial, sans-serif;
    }
    .title {
      font-family: Arial Black, sans-serif;
      font-size: clamp(1.8rem, 6vw, 3rem);
      font-weight: 900;
      letter-spacing: -1px;
      color: #f0f0f0;
      text-transform: uppercase;
      line-height: 1;
    }
    .title span { color: #e10600; }
    .sub {
      font-family: 'Courier New', monospace;
      font-size: 9px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #2a2a2a;
      margin-top: 8px;
    }
    .spinner {
      width: 28px; height: 28px;
      border: 3px solid #111;
      border-top-color: #e10600;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin-top: 28px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- Loading screen -->
  <div id="loader">
    <div class="badge">Formula 1 · 2026 Season</div>
    <div class="title">Live <span>Season</span> Hub</div>
    <div class="sub">FastF1 + OpenF1 + F1 Official</div>
    <div class="spinner"></div>
  </div>

  <!-- Streamlit footer cover -->
  <div id="footer-cover"></div>

  <!-- App iframe — embed params hide Streamlit UI -->
  <iframe
    id="frame"
    src="https://emealof1.streamlit.app/?embed=true&embed_options=hide_footer,hide_toolbar,dark_theme"
    allow="autoplay"
    loading="lazy"
  ></iframe>

  <script>
    const loader = document.getElementById('loader');

    // Hide loader after iframe loads
    document.getElementById('frame').addEventListener('load', () => {
      setTimeout(() => {
        loader.classList.add('hidden');
        setTimeout(() => loader.remove(), 600);
      }, 2000);
    });

    // Failsafe — hide loader after 10s
    setTimeout(() => loader.classList.add('hidden'), 10000);
  </script>

</body>
</html>
