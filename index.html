<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>F1 2026 — Live Season Hub</title>
  <meta name="description" content="F1 2026 Live Season Hub — Real-time timing, standings, lap analysis">
  <meta name="theme-color" content="#e10600">
  <!-- Prevent sharing preview from showing Streamlit -->
  <meta property="og:title" content="F1 2026 Live Season Hub">
  <meta property="og:description" content="Live timing, standings, lap analysis & race results">
  <meta property="og:image" content="https://upload.wikimedia.org/wikipedia/commons/thumb/3/33/F1.svg/320px-F1.svg.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #050505; }
    #frame {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    /* Hide Streamlit footer/manage button via CSS injection */
    #loader {
      position: fixed;
      inset: 0;
      background: #050505;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity .5s ease;
    }
    #loader.hidden { opacity: 0; pointer-events: none; }
    .f1-logo {
      font-family: Arial Black, sans-serif;
      font-size: 3rem;
      font-weight: 900;
      letter-spacing: -2px;
      color: #f0f0f0;
      text-transform: uppercase;
    }
    .f1-logo span { color: #e10600; }
    .f1-sub {
      font-family: 'Courier New', monospace;
      font-size: 10px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #333;
      margin-top: 8px;
    }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid #1a1a1a;
      border-top-color: #e10600;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-top: 24px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- Loading screen -->
  <div id="loader">
    <div class="f1-logo">Live <span>Season</span> Hub</div>
    <div class="f1-sub">2026 · Loading data…</div>
    <div class="spinner"></div>
  </div>

  <!-- Streamlit app fullscreen -->
  <iframe
    id="frame"
    src="https://emealof1.streamlit.app/?embed=true&embed_options=hide_footer,hide_toolbar,dark_theme"
    allow="autoplay"
    loading="lazy"
  ></iframe>

  <script>
    const frame = document.getElementById('frame');
    const loader = document.getElementById('loader');

    // Hide loader when iframe loads
    frame.addEventListener('load', () => {
      setTimeout(() => {
        loader.classList.add('hidden');
        setTimeout(() => loader.remove(), 500);
      }, 1500);
    });

    // Fallback — hide loader after 8s regardless
    setTimeout(() => {
      loader.classList.add('hidden');
    }, 8000);
  </script>
</body>
</html>
